<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 376" width="486" height="376" role="img" aria-labelledby="figtitle-ch19-recovery-backpressure" class="bookfig">
<title id="figtitle-ch19-recovery-backpressure">Two panels contrast unrestricted retry traffic, where retries multiply demand against a constrained dependency into an overload spiral, with an admission-limited policy that applies jittered backoff and reserves bounded recovery capacity beside live arrivals.</title>
