<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 436" width="486" height="436" role="img" aria-labelledby="figtitle-ch18-epoch-fencing" class="bookfig">
<title id="figtitle-ch18-epoch-fencing">A fencing sequence in which worker A prepares a mutation under epoch 41, the lease expires, the control plane grants epoch 42 to worker B, the protected boundary rejects worker A's late epoch-41 mutation, and worker B's epoch-42 mutation becomes eligible for validation.</title>
<style>.bookfig .f-bg{fill:#ffffff}.bookfig .s-bg{stroke:#ffffff}.bookfig .f-ink{fill:#1a1a1a}.bookfig .s-ink{stroke:#1a1a1a}.bookfig .f-mid{fill:#6b6b6b}.bookfig .s-mid{stroke:#6b6b6b}.bookfig .f-faint{fill:#b8b8b8}.bookfig .s-faint{stroke:#b8b8b8}.bookfig .f-wash{fill:#e2e2e2}.bookfig .s-wash{stroke:#e2e2e2}.bookfig .f-accent{fill:#000000}.bookfig .s-accent{stroke:#000000}.bookfig .f-onacc{fill:#ffffff}.bookfig .s-onacc{stroke:#ffffff}@media (prefers-color-scheme:dark){.bookfig .f-bg{fill:#232019}.bookfig .s-bg{stroke:#232019}.bookfig .f-ink{fill:#ede5d6}.bookfig .s-ink{stroke:#ede5d6}.bookfig .f-mid{fill:#9a8f7c}.bookfig .s-mid{stroke:#9a8f7c}.bookfig .f-faint{fill:#5c5346}.bookfig .s-faint{stroke:#5c5346}.bookfig .f-wash{fill:#3d382f}.bookfig .s-wash{stroke:#3d382f}.bookfig .f-accent{fill:#ffffff}.bookfig .s-accent{stroke:#ffffff}.bookfig .f-onacc{fill:#232019}.bookfig .s-onacc{stroke:#232019}}:where([data-theme="dark"]) .bookfig .f-bg{fill:#232019}:where([data-theme="dark"]) .bookfig .s-bg{stroke:#232019}:where([data-theme="dark"]) .bookfig .f-ink{fill:#ede5d6}:where([data-theme="dark"]) .bookfig .s-ink{stroke:#ede5d6}:where([data-theme="dark"]) .bookfig .f-mid{fill:#9a8f7c}:where([data-theme="dark"]) .bookfig .s-mid{stroke:#9a8f7c}:where([data-theme="dark"]) .bookfig .f-faint{fill:#5c5346}:where([data-theme="dark"]) .bookfig .s-faint{stroke:#5c5346}:where([data-theme="dark"]) .bookfig .f-wash{fill:#3d382f}:where([data-theme="dark"]) .bookfig .s-wash{stroke:#3d382f}:where([data-theme="dark"]) .bookfig .f-accent{fill:#ffffff}:where([data-theme="dark"]) .bookfig .s-accent{stroke:#ffffff}:where([data-theme="dark"]) .bookfig .f-onacc{fill:#232019}:where([data-theme="dark"]) .bookfig .s-onacc{stroke:#232019}:where([data-theme="light"]) .bookfig .f-bg{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-bg{stroke:#ffffff}:where([data-theme="light"]) .bookfig .f-ink{fill:#1a1a1a}:where([data-theme="light"]) .bookfig .s-ink{stroke:#1a1a1a}:where([data-theme="light"]) .bookfig .f-mid{fill:#6b6b6b}:where([data-theme="light"]) .bookfig .s-mid{stroke:#6b6b6b}:where([data-theme="light"]) .bookfig .f-faint{fill:#b8b8b8}:where([data-theme="light"]) .bookfig .s-faint{stroke:#b8b8b8}:where([data-theme="light"]) .bookfig .f-wash{fill:#e2e2e2}:where([data-theme="light"]) .bookfig .s-wash{stroke:#e2e2e2}:where([data-theme="light"]) .bookfig .f-accent{fill:#000000}:where([data-theme="light"]) .bookfig .s-accent{stroke:#000000}:where([data-theme="light"]) .bookfig .f-onacc{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-onacc{stroke:#ffffff}</style>
<rect class="f-bg" width="486" height="436" fill="#ffffff"/>
<line class="s-faint" x1="60" y1="44" x2="60" y2="346" stroke="#b8b8b8" stroke-width="1.4"/>
<circle class="f-mid" cx="60" cy="44" r="5" fill="#6b6b6b"/>
<text class="f-ink" x="76" y="47.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">epoch 41: worker A holds the lease, prepares a mutation on W-311</text>
<circle class="f-mid" cx="60" cy="96" r="5" fill="#6b6b6b"/>
<text class="f-ink" x="76" y="99.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">lease expires; control plane increments authority to epoch 42</text>
<text class="f-mid" x="76" y="114.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">the lease answers allocation and liveness, not safety</text>
<circle class="f-mid" cx="60" cy="162" r="5" fill="#6b6b6b"/>
<text class="f-ink" x="76" y="165.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">epoch 42: worker B claims W-311 and starts a new attempt</text>
<circle class="f-mid" cx="60" cy="214" r="5" fill="#6b6b6b"/>
<text class="f-ink" x="76" y="217.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">worker A resumes and submits its mutation, tagged epoch 41</text>
<text class="f-mid" x="76" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">A is not dead and was never told it lost authority</text>
<circle class="f-accent" cx="60" cy="280" r="6" fill="#000000"/>
<text class="f-accent" font-weight="bold" x="76" y="283.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="start">the boundary compares 41 against the current epoch 42: rejected</text>
<text class="f-mid" x="76" y="298.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">fencing happens at the protected target, not at the scheduler</text>
<circle class="f-mid" cx="60" cy="346" r="5" fill="#6b6b6b"/>
<text class="f-ink" x="76" y="349.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">worker B's mutation, tagged epoch 42, is eligible for validation</text>
<text class="f-mid" x="76" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">the current epoch confers the right to be evaluated,</text>
<text class="f-mid" x="76" y="377.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">not a presumption of correctness</text>
<line class="s-mid" x1="44" y1="206" x2="44" y2="288" stroke="#6b6b6b" stroke-width="1.4"/>
<line class="s-mid" x1="44" y1="206" x2="51" y2="206" stroke="#6b6b6b" stroke-width="1.4"/>
<line class="s-mid" x1="44" y1="288" x2="51" y2="288" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" x="33" y="247" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 33 247)">stale authority</text>
<text class="f-ink" x="20.8" y="404" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start">The lease allocates work; only the epoch check at the mutation</text>
<text class="f-ink" x="20.8" y="420" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start">boundary makes a superseded writer safe</text>
</svg>
