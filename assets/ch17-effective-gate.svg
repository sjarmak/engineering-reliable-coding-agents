<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" aria-labelledby="figtitle-ch16-effective-gate" class="bookfig">
<title id="figtitle-ch16-effective-gate">An advisory review can record rejection while leaving execution reachable. An effective gate connects the review decision to an enforcement point, so rejection or modification changes the next reachable state.</title>
<style>.bookfig .f-bg{fill:#ffffff}.bookfig .s-bg{stroke:#ffffff}.bookfig .f-ink{fill:#1a1a1a}.bookfig .s-ink{stroke:#1a1a1a}.bookfig .f-mid{fill:#6b6b6b}.bookfig .s-mid{stroke:#6b6b6b}.bookfig .f-faint{fill:#b8b8b8}.bookfig .s-faint{stroke:#b8b8b8}.bookfig .f-wash{fill:#e2e2e2}.bookfig .s-wash{stroke:#e2e2e2}.bookfig .f-accent{fill:#000000}.bookfig .s-accent{stroke:#000000}.bookfig .f-onacc{fill:#ffffff}.bookfig .s-onacc{stroke:#ffffff}@media (prefers-color-scheme:dark){.bookfig .f-bg{fill:#232019}.bookfig .s-bg{stroke:#232019}.bookfig .f-ink{fill:#ede5d6}.bookfig .s-ink{stroke:#ede5d6}.bookfig .f-mid{fill:#9a8f7c}.bookfig .s-mid{stroke:#9a8f7c}.bookfig .f-faint{fill:#5c5346}.bookfig .s-faint{stroke:#5c5346}.bookfig .f-wash{fill:#3d382f}.bookfig .s-wash{stroke:#3d382f}.bookfig .f-accent{fill:#ffffff}.bookfig .s-accent{stroke:#ffffff}.bookfig .f-onacc{fill:#232019}.bookfig .s-onacc{stroke:#232019}}:where([data-theme="dark"]) .bookfig .f-bg{fill:#232019}:where([data-theme="dark"]) .bookfig .s-bg{stroke:#232019}:where([data-theme="dark"]) .bookfig .f-ink{fill:#ede5d6}:where([data-theme="dark"]) .bookfig .s-ink{stroke:#ede5d6}:where([data-theme="dark"]) .bookfig .f-mid{fill:#9a8f7c}:where([data-theme="dark"]) .bookfig .s-mid{stroke:#9a8f7c}:where([data-theme="dark"]) .bookfig .f-faint{fill:#5c5346}:where([data-theme="dark"]) .bookfig .s-faint{stroke:#5c5346}:where([data-theme="dark"]) .bookfig .f-wash{fill:#3d382f}:where([data-theme="dark"]) .bookfig .s-wash{stroke:#3d382f}:where([data-theme="dark"]) .bookfig .f-accent{fill:#ffffff}:where([data-theme="dark"]) .bookfig .s-accent{stroke:#ffffff}:where([data-theme="dark"]) .bookfig .f-onacc{fill:#232019}:where([data-theme="dark"]) .bookfig .s-onacc{stroke:#232019}:where([data-theme="light"]) .bookfig .f-bg{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-bg{stroke:#ffffff}:where([data-theme="light"]) .bookfig .f-ink{fill:#1a1a1a}:where([data-theme="light"]) .bookfig .s-ink{stroke:#1a1a1a}:where([data-theme="light"]) .bookfig .f-mid{fill:#6b6b6b}:where([data-theme="light"]) .bookfig .s-mid{stroke:#6b6b6b}:where([data-theme="light"]) .bookfig .f-faint{fill:#b8b8b8}:where([data-theme="light"]) .bookfig .s-faint{stroke:#b8b8b8}:where([data-theme="light"]) .bookfig .f-wash{fill:#e2e2e2}:where([data-theme="light"]) .bookfig .s-wash{stroke:#e2e2e2}:where([data-theme="light"]) .bookfig .f-accent{fill:#000000}:where([data-theme="light"]) .bookfig .s-accent{stroke:#000000}:where([data-theme="light"]) .bookfig .f-onacc{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-onacc{stroke:#ffffff}</style>
<rect class="f-bg" width="680" height="350"/>

<!-- Advisory lane: the review result never intersects the execution path. -->
<text class="f-ink" x="35" y="42" font-family="Helvetica, Arial, sans-serif" font-size="15">advisory review</text>
<line class="s-faint" x1="85" y1="92" x2="600" y2="92" stroke-width="2"/>
<line class="s-accent" x1="405" y1="92" x2="600" y2="92" stroke-width="1.4" stroke-dasharray="5 5"/>
<polygon class="f-mid" points="224,85 236,92 224,99"/>
<polygon class="f-mid" points="389,85 401,92 389,99"/>
<polygon class="f-accent" points="584,85 596,92 584,99"/>
<circle class="f-mid" cx="85" cy="92" r="7"/>
<circle class="f-mid" cx="240" cy="92" r="7"/>
<circle class="f-mid" cx="405" cy="92" r="7"/>
<circle class="f-accent" cx="600" cy="92" r="8"/>

<text class="f-mid" x="162" y="70" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">inspect</text>
<text class="f-mid" x="322" y="70" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">reject</text>
<text class="f-accent" font-weight="bold" x="500" y="70" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">log only</text>
<text class="f-ink" x="85" y="121" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">proposal + provenance</text>
<text class="f-ink" x="240" y="121" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">reviewer</text>
<text class="f-ink" x="405" y="121" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">decision recorded</text>
<text class="f-accent" font-weight="bold" x="600" y="121" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">action executes</text>
<text class="f-mid" x="340" y="153" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">The record changes; the reachable execution state does not</text>

<!-- Effective lane: the decision intersects a tested enforcement point. -->
<text class="f-ink" x="35" y="202" font-family="Helvetica, Arial, sans-serif" font-size="15">effective gate</text>
<line class="s-faint" x1="85" y1="250" x2="600" y2="250" stroke-width="2"/>
<line class="s-accent" x1="405" y1="250" x2="600" y2="250" stroke-width="2"/>
<polygon class="f-mid" points="224,243 236,250 224,257"/>
<polygon class="f-mid" points="389,243 401,250 389,257"/>
<polygon class="f-accent" points="584,243 596,250 584,257"/>
<circle class="f-mid" cx="85" cy="250" r="7"/>
<circle class="f-mid" cx="240" cy="250" r="7"/>
<circle class="f-accent" cx="405" cy="250" r="8"/>
<circle class="f-accent" cx="600" cy="250" r="8"/>

<text class="f-mid" x="162" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">inspect</text>
<text class="f-mid" x="322" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">reject or modify</text>
<text class="f-accent" font-weight="bold" x="500" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">enforce</text>
<text class="f-ink" x="85" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">proposal + provenance</text>
<text class="f-ink" x="240" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">reviewer</text>
<text class="f-accent" font-weight="bold" x="405" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">enforcement point</text>
<text class="f-accent" font-weight="bold" x="600" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">blocked or revised</text>
<text class="f-ink" x="340" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">The decision changes the next reachable state</text>

<text class="f-mid" x="340" y="338" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Audit rejection, modification, timeout, and dependency failure against the running path</text>
</svg>
