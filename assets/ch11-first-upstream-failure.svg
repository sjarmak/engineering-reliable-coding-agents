<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 448" width="486" height="448" role="img" aria-labelledby="figtitle-ch10-first-upstream-failure" class="bookfig">
<title id="figtitle-ch10-first-upstream-failure">A planning error is the first upstream failure linking four visible defects, while a counterfactual test distinguishes a plausible causal boundary from a symptom.</title>
<style>.bookfig .f-bg{fill:#ffffff}.bookfig .s-bg{stroke:#ffffff}.bookfig .f-ink{fill:#1a1a1a}.bookfig .s-ink{stroke:#1a1a1a}.bookfig .f-mid{fill:#6b6b6b}.bookfig .s-mid{stroke:#6b6b6b}.bookfig .f-faint{fill:#b8b8b8}.bookfig .s-faint{stroke:#b8b8b8}.bookfig .f-wash{fill:#e2e2e2}.bookfig .s-wash{stroke:#e2e2e2}.bookfig .f-accent{fill:#b34300}.bookfig .s-accent{stroke:#b34300}.bookfig .f-onacc{fill:#ffffff}.bookfig .s-onacc{stroke:#ffffff}@media (prefers-color-scheme:dark){.bookfig .f-bg{fill:#232019}.bookfig .s-bg{stroke:#232019}.bookfig .f-ink{fill:#ede5d6}.bookfig .s-ink{stroke:#ede5d6}.bookfig .f-mid{fill:#9a8f7c}.bookfig .s-mid{stroke:#9a8f7c}.bookfig .f-faint{fill:#5c5346}.bookfig .s-faint{stroke:#5c5346}.bookfig .f-wash{fill:#3d382f}.bookfig .s-wash{stroke:#3d382f}.bookfig .f-accent{fill:#df9d5e}.bookfig .s-accent{stroke:#df9d5e}.bookfig .f-onacc{fill:#232019}.bookfig .s-onacc{stroke:#232019}}:where([data-theme="dark"]) .bookfig .f-bg{fill:#232019}:where([data-theme="dark"]) .bookfig .s-bg{stroke:#232019}:where([data-theme="dark"]) .bookfig .f-ink{fill:#ede5d6}:where([data-theme="dark"]) .bookfig .s-ink{stroke:#ede5d6}:where([data-theme="dark"]) .bookfig .f-mid{fill:#9a8f7c}:where([data-theme="dark"]) .bookfig .s-mid{stroke:#9a8f7c}:where([data-theme="dark"]) .bookfig .f-faint{fill:#5c5346}:where([data-theme="dark"]) .bookfig .s-faint{stroke:#5c5346}:where([data-theme="dark"]) .bookfig .f-wash{fill:#3d382f}:where([data-theme="dark"]) .bookfig .s-wash{stroke:#3d382f}:where([data-theme="dark"]) .bookfig .f-accent{fill:#df9d5e}:where([data-theme="dark"]) .bookfig .s-accent{stroke:#df9d5e}:where([data-theme="dark"]) .bookfig .f-onacc{fill:#232019}:where([data-theme="dark"]) .bookfig .s-onacc{stroke:#232019}:where([data-theme="light"]) .bookfig .f-bg{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-bg{stroke:#ffffff}:where([data-theme="light"]) .bookfig .f-ink{fill:#1a1a1a}:where([data-theme="light"]) .bookfig .s-ink{stroke:#1a1a1a}:where([data-theme="light"]) .bookfig .f-mid{fill:#6b6b6b}:where([data-theme="light"]) .bookfig .s-mid{stroke:#6b6b6b}:where([data-theme="light"]) .bookfig .f-faint{fill:#b8b8b8}:where([data-theme="light"]) .bookfig .s-faint{stroke:#b8b8b8}:where([data-theme="light"]) .bookfig .f-wash{fill:#e2e2e2}:where([data-theme="light"]) .bookfig .s-wash{stroke:#e2e2e2}:where([data-theme="light"]) .bookfig .f-accent{fill:#b34300}:where([data-theme="light"]) .bookfig .s-accent{stroke:#b34300}:where([data-theme="light"]) .bookfig .f-onacc{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-onacc{stroke:#ffffff}</style>
<rect class="f-bg" width="486" height="448" fill="#ffffff"/>
<circle class="f-accent" cx="145.7" cy="55.5" r="6.0" fill="#b34300"/>
<text class="f-accent" x="159.6" y="59.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b34300" text-anchor="start">incorrect plan</text>
<line class="s-mid" x1="145.7" y1="65.2" x2="145.7" y2="81.2" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 145.7 90.2 L 140.5 81.2 L 150.9 81.2 Z" fill="#6b6b6b"/>
<circle class="f-mid" cx="145.7" cy="99.9" r="4.6" fill="#6b6b6b"/>
<text class="f-ink" x="159.6" y="103.4" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">edits the wrong module</text>
<line class="s-mid" x1="145.7" y1="109.7" x2="145.7" y2="125.6" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 145.7 134.6 L 140.5 125.6 L 150.9 125.6 Z" fill="#6b6b6b"/>
<circle class="f-mid" cx="145.7" cy="144.4" r="4.6" fill="#6b6b6b"/>
<text class="f-ink" x="159.6" y="147.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">invokes a test from the wrong directory</text>
<line class="s-mid" x1="145.7" y1="154.1" x2="145.7" y2="170.1" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 145.7 179.1 L 140.5 170.1 L 150.9 170.1 Z" fill="#6b6b6b"/>
<circle class="f-mid" cx="145.7" cy="188.8" r="4.6" fill="#6b6b6b"/>
<text class="f-ink" x="159.6" y="192.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">misreads the failure</text>
<text class="f-accent" x="159.6" y="38.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b34300" text-anchor="start">first upstream failure</text>
<text class="f-mid" x="159.6" y="73.6" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">directed all subsequent work toward the wrong module</text>
<line class="s-mid" x1="129.1" y1="55.5" x2="129.1" y2="188.8" stroke="#6b6b6b" stroke-width="1.4"/>
<line class="s-mid" x1="129.1" y1="55.5" x2="137.4" y2="55.5" stroke="#6b6b6b" stroke-width="1.4"/>
<line class="s-mid" x1="129.1" y1="188.8" x2="137.4" y2="188.8" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" x="118.0" y="122.1" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 118.0 122.1)">four visible defects</text>
<text class="f-ink" x="20.8" y="252.6" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start">If this step had been correct while the preceding record stayed the same,</text>
<text class="f-ink" x="20.8" y="269.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start">could the later failure still have occurred by the observed path?</text>
<line class="s-mid" x1="83.3" y1="281.8" x2="83.3" y2="297.7" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 83.3 306.7 L 78.1 297.7 L 88.5 297.7 Z" fill="#6b6b6b"/>
<line class="s-mid" x1="277.6" y1="281.8" x2="277.6" y2="297.7" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 277.6 306.7 L 272.4 297.7 L 282.8 297.7 Z" fill="#6b6b6b"/>
<text class="f-ink" x="83.3" y="320.6" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">no</text>
<text class="f-accent" x="83.3" y="337.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b34300" text-anchor="middle">plausible causal boundary</text>
<text class="f-ink" x="277.6" y="320.6" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">yes</text>
<text class="f-mid" x="277.6" y="337.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">probably a symptom</text>
</svg>
