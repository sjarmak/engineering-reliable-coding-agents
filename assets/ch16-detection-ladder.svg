<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 300" width="486" height="300" role="img" aria-labelledby="figtitle-ch16-detection-ladder" class="bookfig">
<title id="figtitle-ch16-detection-ladder">Each kind of detection routes to the least complex mechanism capable of checking it, and every layer must expose the evidence the next one needs.</title>
<style>.bookfig .f-bg{fill:#ffffff}.bookfig .s-bg{stroke:#ffffff}.bookfig .f-ink{fill:#1a1a1a}.bookfig .s-ink{stroke:#1a1a1a}.bookfig .f-mid{fill:#6b6b6b}.bookfig .s-mid{stroke:#6b6b6b}.bookfig .f-faint{fill:#b8b8b8}.bookfig .s-faint{stroke:#b8b8b8}.bookfig .f-wash{fill:#e2e2e2}.bookfig .s-wash{stroke:#e2e2e2}.bookfig .f-accent{fill:#000000}.bookfig .s-accent{stroke:#000000}.bookfig .f-onacc{fill:#ffffff}.bookfig .s-onacc{stroke:#ffffff}@media (prefers-color-scheme:dark){.bookfig .f-bg{fill:#232019}.bookfig .s-bg{stroke:#232019}.bookfig .f-ink{fill:#ede5d6}.bookfig .s-ink{stroke:#ede5d6}.bookfig .f-mid{fill:#9a8f7c}.bookfig .s-mid{stroke:#9a8f7c}.bookfig .f-faint{fill:#5c5346}.bookfig .s-faint{stroke:#5c5346}.bookfig .f-wash{fill:#3d382f}.bookfig .s-wash{stroke:#3d382f}.bookfig .f-accent{fill:#ffffff}.bookfig .s-accent{stroke:#ffffff}.bookfig .f-onacc{fill:#232019}.bookfig .s-onacc{stroke:#232019}}:where([data-theme="dark"]) .bookfig .f-bg{fill:#232019}:where([data-theme="dark"]) .bookfig .s-bg{stroke:#232019}:where([data-theme="dark"]) .bookfig .f-ink{fill:#ede5d6}:where([data-theme="dark"]) .bookfig .s-ink{stroke:#ede5d6}:where([data-theme="dark"]) .bookfig .f-mid{fill:#9a8f7c}:where([data-theme="dark"]) .bookfig .s-mid{stroke:#9a8f7c}:where([data-theme="dark"]) .bookfig .f-faint{fill:#5c5346}:where([data-theme="dark"]) .bookfig .s-faint{stroke:#5c5346}:where([data-theme="dark"]) .bookfig .f-wash{fill:#3d382f}:where([data-theme="dark"]) .bookfig .s-wash{stroke:#3d382f}:where([data-theme="dark"]) .bookfig .f-accent{fill:#ffffff}:where([data-theme="dark"]) .bookfig .s-accent{stroke:#ffffff}:where([data-theme="dark"]) .bookfig .f-onacc{fill:#232019}:where([data-theme="dark"]) .bookfig .s-onacc{stroke:#232019}:where([data-theme="light"]) .bookfig .f-bg{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-bg{stroke:#ffffff}:where([data-theme="light"]) .bookfig .f-ink{fill:#1a1a1a}:where([data-theme="light"]) .bookfig .s-ink{stroke:#1a1a1a}:where([data-theme="light"]) .bookfig .f-mid{fill:#6b6b6b}:where([data-theme="light"]) .bookfig .s-mid{stroke:#6b6b6b}:where([data-theme="light"]) .bookfig .f-faint{fill:#b8b8b8}:where([data-theme="light"]) .bookfig .s-faint{stroke:#b8b8b8}:where([data-theme="light"]) .bookfig .f-wash{fill:#e2e2e2}:where([data-theme="light"]) .bookfig .s-wash{stroke:#e2e2e2}:where([data-theme="light"]) .bookfig .f-accent{fill:#000000}:where([data-theme="light"]) .bookfig .s-accent{stroke:#000000}:where([data-theme="light"]) .bookfig .f-onacc{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-onacc{stroke:#ffffff}</style>
<rect class="f-bg" width="486" height="300" fill="#ffffff"/>
<text class="f-mid" x="104" y="30" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">kind of detection</text>
<text class="f-mid" x="252" y="30" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">least complex mechanism</text>
<text class="f-mid" x="400" y="30" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">evidence it must expose</text>
<line class="s-faint" x1="39" y1="40" x2="465" y2="40" stroke="#b8b8b8" stroke-width="1.2"/>
<rect class="f-accent s-accent" x="39.0" y="52" width="130" height="48" fill="#000000" fill-opacity="0.16" stroke="#000000" stroke-width="1.4"/>
<text class="f-ink" x="104" y="79.7" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">exact violation</text>
<rect class="f-wash" x="187.0" y="52" width="130" height="48" fill="#e2e2e2" fill-opacity="0.85"/>
<text class="f-ink" x="252" y="79.7" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">deterministic rule</text>
<rect class="s-mid" x="335.0" y="52" width="130" height="48" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" x="400" y="72.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">event and the</text>
<text class="f-ink" x="400" y="87.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">matched policy clause</text>
<rect class="f-accent s-accent" x="39.0" y="124" width="130" height="48" fill="#000000" fill-opacity="0.16" stroke="#000000" stroke-width="1.4"/>
<text class="f-ink" x="104" y="151.7" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">contextual judgment</text>
<rect class="f-wash" x="187.0" y="124" width="130" height="48" fill="#e2e2e2" fill-opacity="0.85"/>
<text class="f-ink" x="252" y="144.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">model judge with</text>
<text class="f-ink" x="252" y="159.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">a fixed rubric</text>
<rect class="s-mid" x="335.0" y="124" width="130" height="48" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" x="400" y="144.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">criterion, trace span,</text>
<text class="f-ink" x="400" y="159.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">and uncertainty</text>
<rect class="f-accent s-accent" x="39.0" y="196" width="130" height="48" fill="#000000" fill-opacity="0.16" stroke="#000000" stroke-width="1.4"/>
<text class="f-ink" x="104" y="216.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">a sequence of actions</text>
<text class="f-ink" x="104" y="231.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">over changing state</text>
<rect class="f-wash" x="187.0" y="196" width="130" height="48" fill="#e2e2e2" fill-opacity="0.85"/>
<text class="f-ink" x="252" y="216.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">agent judge reading</text>
<text class="f-ink" x="252" y="231.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">the live trace</text>
<rect class="s-mid" x="335.0" y="196" width="130" height="48" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" x="400" y="216.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">observations and</text>
<text class="f-ink" x="400" y="231.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">intermediate actions</text>
<line class="s-mid" x1="22" y1="56" x2="22" y2="228" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 22 238 L 16.8 229.0 L 27.2 229.0 Z" fill="#6b6b6b"/>
<text class="f-mid" x="10" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" transform="rotate(-90 10 146)">increasing mechanism complexity</text>
<text class="f-ink" x="243" y="276" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">a human reviewer calibrates the layers and owns the final verdict</text>
</svg>
