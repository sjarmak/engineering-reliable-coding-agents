<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 450" width="486" height="450" role="img" aria-labelledby="figtitle-ch09-durable-effects" class="bookfig">
<title id="figtitle-ch09-durable-effects">A first attempt records a durable intent and effect identity before an external commit. When the acknowledgment is lost and the worker dies, no completion record exists, so a restart reads the pending intent and retries under the same effect identity; the external boundary must return the prior result, converge, or force explicit reconciliation.</title>
<style>.bookfig .f-bg{fill:#ffffff}.bookfig .s-bg{stroke:#ffffff}.bookfig .f-ink{fill:#1a1a1a}.bookfig .s-ink{stroke:#1a1a1a}.bookfig .f-mid{fill:#6b6b6b}.bookfig .s-mid{stroke:#6b6b6b}.bookfig .f-faint{fill:#b8b8b8}.bookfig .s-faint{stroke:#b8b8b8}.bookfig .f-wash{fill:#e2e2e2}.bookfig .s-wash{stroke:#e2e2e2}.bookfig .f-accent{fill:#000000}.bookfig .s-accent{stroke:#000000}.bookfig .f-onacc{fill:#ffffff}.bookfig .s-onacc{stroke:#ffffff}@media (prefers-color-scheme:dark){.bookfig .f-bg{fill:#232019}.bookfig .s-bg{stroke:#232019}.bookfig .f-ink{fill:#ede5d6}.bookfig .s-ink{stroke:#ede5d6}.bookfig .f-mid{fill:#9a8f7c}.bookfig .s-mid{stroke:#9a8f7c}.bookfig .f-faint{fill:#5c5346}.bookfig .s-faint{stroke:#5c5346}.bookfig .f-wash{fill:#3d382f}.bookfig .s-wash{stroke:#3d382f}.bookfig .f-accent{fill:#ffffff}.bookfig .s-accent{stroke:#ffffff}.bookfig .f-onacc{fill:#232019}.bookfig .s-onacc{stroke:#232019}}:where([data-theme="dark"]) .bookfig .f-bg{fill:#232019}:where([data-theme="dark"]) .bookfig .s-bg{stroke:#232019}:where([data-theme="dark"]) .bookfig .f-ink{fill:#ede5d6}:where([data-theme="dark"]) .bookfig .s-ink{stroke:#ede5d6}:where([data-theme="dark"]) .bookfig .f-mid{fill:#9a8f7c}:where([data-theme="dark"]) .bookfig .s-mid{stroke:#9a8f7c}:where([data-theme="dark"]) .bookfig .f-faint{fill:#5c5346}:where([data-theme="dark"]) .bookfig .s-faint{stroke:#5c5346}:where([data-theme="dark"]) .bookfig .f-wash{fill:#3d382f}:where([data-theme="dark"]) .bookfig .s-wash{stroke:#3d382f}:where([data-theme="dark"]) .bookfig .f-accent{fill:#ffffff}:where([data-theme="dark"]) .bookfig .s-accent{stroke:#ffffff}:where([data-theme="dark"]) .bookfig .f-onacc{fill:#232019}:where([data-theme="dark"]) .bookfig .s-onacc{stroke:#232019}:where([data-theme="light"]) .bookfig .f-bg{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-bg{stroke:#ffffff}:where([data-theme="light"]) .bookfig .f-ink{fill:#1a1a1a}:where([data-theme="light"]) .bookfig .s-ink{stroke:#1a1a1a}:where([data-theme="light"]) .bookfig .f-mid{fill:#6b6b6b}:where([data-theme="light"]) .bookfig .s-mid{stroke:#6b6b6b}:where([data-theme="light"]) .bookfig .f-faint{fill:#b8b8b8}:where([data-theme="light"]) .bookfig .s-faint{stroke:#b8b8b8}:where([data-theme="light"]) .bookfig .f-wash{fill:#e2e2e2}:where([data-theme="light"]) .bookfig .s-wash{stroke:#e2e2e2}:where([data-theme="light"]) .bookfig .f-accent{fill:#000000}:where([data-theme="light"]) .bookfig .s-accent{stroke:#000000}:where([data-theme="light"]) .bookfig .f-onacc{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-onacc{stroke:#ffffff}</style>
<rect class="f-bg" width="486" height="450"/>

<line class="s-faint" x1="74" y1="44" x2="74" y2="386" stroke-width="1.4"/>

<path class="s-accent" d="M63 150 L56 150 L56 232 L63 232" fill="none" stroke-width="1.4"/>
<text class="f-mid" x="22.7" y="191" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" transform="rotate(-90 22.7 191)">the execute-then-log gap</text>
<text class="f-accent" font-weight="bold" x="37.3" y="191" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" transform="rotate(-90 37.3 191)">no durable completion</text>

<circle class="f-mid" cx="74" cy="44" r="5"/>
<text class="f-ink" x="90" y="48" font-family="Helvetica, Arial, sans-serif" font-size="12.5">record intent durably: request(effect_id 42)</text>
<text class="f-mid" x="90" y="63" font-family="Helvetica, Arial, sans-serif" font-size="10.5">the intent survives the worker that wrote it</text>

<circle class="f-mid" cx="74" cy="108" r="5"/>
<text class="f-ink" x="90" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12.5">attempt A dispatches the request</text>

<circle class="f-mid" cx="74" cy="158" r="5"/>
<text class="f-ink" x="90" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12.5">external commit: the world changes</text>
<text class="f-mid" x="90" y="177" font-family="Helvetica, Arial, sans-serif" font-size="10.5">barrier: an effect accepted outside the orchestration boundary</text>

<circle class="f-accent" cx="74" cy="222" r="6"/>
<text class="f-accent" font-weight="bold" x="90" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5">acknowledgment lost; worker dies</text>
<text class="f-mid" x="90" y="241" font-family="Helvetica, Arial, sans-serif" font-size="10.5">no completion record was ever written</text>

<circle class="f-mid" cx="74" cy="286" r="5"/>
<text class="f-ink" x="90" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12.5">restart reads the durable pending intent</text>

<circle class="f-mid" cx="74" cy="336" r="5"/>
<text class="f-ink" x="90" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12.5">attempt B retries with the same effect_id 42</text>

<circle class="f-mid" cx="74" cy="386" r="5"/>
<text class="f-ink" x="90" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12.5">the boundary returns the prior result, converges,</text>
<text class="f-ink" x="90" y="405" font-family="Helvetica, Arial, sans-serif" font-size="12.5">or forces explicit reconciliation</text>

<text class="f-mid" x="20.8" y="437" font-family="Helvetica, Arial, sans-serif" font-size="11.5">Retries reuse the effect identity; new logical work receives a new key</text>
</svg>
