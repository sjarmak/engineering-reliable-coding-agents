<title id="figtitle-ch07-factory-decomposition">Identity and boundary model: logical work carries an ownership epoch granting authority to an attempt, an input state observed by the attempt that produces a candidate artifact bound to a verification record, and an effect identity for each external commitment, which is paired with an owned reconciliation path.</title>
