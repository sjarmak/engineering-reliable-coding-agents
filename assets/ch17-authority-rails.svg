<text class="f-ink" x="306" y="55.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">evidence</text>
<rect class="f-wash" x="358.2" y="16" width="107.5" height="56" fill="#e2e2e2" fill-opacity="0.85"/>
<text class="f-ink" x="412" y="40.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">one wider rung,</text>
<text class="f-ink" x="412" y="55.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">not a wider system</text>
