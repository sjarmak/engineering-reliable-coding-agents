<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 372" width="486" height="372" role="img" aria-labelledby="figtitle-ch17-authority-rails" class="bookfig">
<title id="figtitle-ch17-authority-rails">Authority widens one rung at a time within a defined action class. Separate rails do not transfer evidence between them, and the approval floor is permanent.</title>
