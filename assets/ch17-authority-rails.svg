<rect class="s-mid" x="17" y="98" width="216" height="104" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" font-weight="bold" x="125" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="middle">service restart rail</text>
<text class="f-mid" x="125" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">transient process state</text>
<text class="f-mid" x="125" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">another restart may reverse it</text>
<text class="f-mid" x="125" y="176" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">clean restarts may widen the rung</text>
<rect class="s-mid" x="253" y="98" width="216" height="104" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" font-weight="bold" x="361" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="middle">credential rotation rail</text>
<text class="f-mid" x="361" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">distributed configuration</text>
<text class="f-mid" x="361" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">invalidates live clients</text>
<text class="f-mid" x="361" y="176" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">may block recovery access</text>
<line class="s-mid" x1="125" y1="202" x2="125" y2="224" stroke="#6b6b6b" stroke-width="1.6"/>
<line class="s-mid" x1="125" y1="224" x2="361" y2="224" stroke="#6b6b6b" stroke-width="1.6"/>
<line class="s-mid" x1="361" y1="224" x2="361" y2="211" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 361 202 L 355.8 211.0 L 366.2 211.0 Z" fill="#6b6b6b"/>
<text class="f-mid" x="243" y="244" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">hundreds of clean restarts here establish nothing about safety there</text>
<rect class="s-mid" x="72.2" y="268" width="115.7" height="30" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" x="130" y="286.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">irreversible actions</text>
<rect class="s-mid" x="278.4" y="268" width="143.2" height="30" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" x="350" y="286.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">high-blast-radius actions</text>
<line class="s-accent" x1="24" y1="312" x2="462" y2="312" stroke="#000000" stroke-width="3.2"/>
<text class="f-ink" font-weight="bold" x="243" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="middle">permanent approval floor</text>
<text class="f-mid" x="243" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">human authorization stays mandatory, and routine success does not remove it</text>
