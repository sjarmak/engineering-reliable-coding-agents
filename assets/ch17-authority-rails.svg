<text class="f-ink" x="186" y="32.7" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">its own approval,</text>
<text class="f-ink" x="186" y="47.7" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">modification, and</text>
<text class="f-ink" x="186" y="62.7" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">outcome record</text>
