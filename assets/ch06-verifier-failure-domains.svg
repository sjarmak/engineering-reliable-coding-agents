<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 358" width="486" height="358" role="img" aria-labelledby="figtitle-ch06-verifier-failure-domains" class="bookfig">
<title id="figtitle-ch06-verifier-failure-domains">A candidate artifact passes through two distinct failure axes, verifier infrastructure health and oracle adequacy, separating a verifier that failed to run from one that ran but cannot detect the defect, with the verdict bound to artifact version, verifier version, and environment.</title>
<style>.bookfig .f-bg{fill:#ffffff}.bookfig .s-bg{stroke:#ffffff}.bookfig .f-ink{fill:#1a1a1a}.bookfig .s-ink{stroke:#1a1a1a}.bookfig .f-mid{fill:#6b6b6b}.bookfig .s-mid{stroke:#6b6b6b}.bookfig .f-faint{fill:#b8b8b8}.bookfig .s-faint{stroke:#b8b8b8}.bookfig .f-wash{fill:#e2e2e2}.bookfig .s-wash{stroke:#e2e2e2}.bookfig .f-accent{fill:#b34300}.bookfig .s-accent{stroke:#b34300}.bookfig .f-onacc{fill:#ffffff}.bookfig .s-onacc{stroke:#ffffff}@media (prefers-color-scheme:dark){.bookfig .f-bg{fill:#232019}.bookfig .s-bg{stroke:#232019}.bookfig .f-ink{fill:#ede5d6}.bookfig .s-ink{stroke:#ede5d6}.bookfig .f-mid{fill:#9a8f7c}.bookfig .s-mid{stroke:#9a8f7c}.bookfig .f-faint{fill:#5c5346}.bookfig .s-faint{stroke:#5c5346}.bookfig .f-wash{fill:#3d382f}.bookfig .s-wash{stroke:#3d382f}.bookfig .f-accent{fill:#df9d5e}.bookfig .s-accent{stroke:#df9d5e}.bookfig .f-onacc{fill:#232019}.bookfig .s-onacc{stroke:#232019}}:where([data-theme="dark"]) .bookfig .f-bg{fill:#232019}:where([data-theme="dark"]) .bookfig .s-bg{stroke:#232019}:where([data-theme="dark"]) .bookfig .f-ink{fill:#ede5d6}:where([data-theme="dark"]) .bookfig .s-ink{stroke:#ede5d6}:where([data-theme="dark"]) .bookfig .f-mid{fill:#9a8f7c}:where([data-theme="dark"]) .bookfig .s-mid{stroke:#9a8f7c}:where([data-theme="dark"]) .bookfig .f-faint{fill:#5c5346}:where([data-theme="dark"]) .bookfig .s-faint{stroke:#5c5346}:where([data-theme="dark"]) .bookfig .f-wash{fill:#3d382f}:where([data-theme="dark"]) .bookfig .s-wash{stroke:#3d382f}:where([data-theme="dark"]) .bookfig .f-accent{fill:#df9d5e}:where([data-theme="dark"]) .bookfig .s-accent{stroke:#df9d5e}:where([data-theme="dark"]) .bookfig .f-onacc{fill:#232019}:where([data-theme="dark"]) .bookfig .s-onacc{stroke:#232019}:where([data-theme="light"]) .bookfig .f-bg{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-bg{stroke:#ffffff}:where([data-theme="light"]) .bookfig .f-ink{fill:#1a1a1a}:where([data-theme="light"]) .bookfig .s-ink{stroke:#1a1a1a}:where([data-theme="light"]) .bookfig .f-mid{fill:#6b6b6b}:where([data-theme="light"]) .bookfig .s-mid{stroke:#6b6b6b}:where([data-theme="light"]) .bookfig .f-faint{fill:#b8b8b8}:where([data-theme="light"]) .bookfig .s-faint{stroke:#b8b8b8}:where([data-theme="light"]) .bookfig .f-wash{fill:#e2e2e2}:where([data-theme="light"]) .bookfig .s-wash{stroke:#e2e2e2}:where([data-theme="light"]) .bookfig .f-accent{fill:#b34300}:where([data-theme="light"]) .bookfig .s-accent{stroke:#b34300}:where([data-theme="light"]) .bookfig .f-onacc{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-onacc{stroke:#ffffff}</style>
<rect class="f-bg" width="486" height="358" fill="#ffffff"/>
<rect class="s-ink" x="155" y="26" width="176" height="32" rx="3" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text class="f-ink" x="243" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">candidate artifact_version X</text>
<line class="s-mid" x1="183" y1="58" x2="140.0" y2="105" stroke="#6b6b6b" stroke-width="1.4"/>
<path class="f-mid" d="M 133.0 105 L 140.0 110.18 L 140.0 99.82 Z" fill="#6b6b6b"/>
<line class="s-mid" x1="303" y1="58" x2="346.0" y2="105" stroke="#6b6b6b" stroke-width="1.4"/>
<path class="f-mid" d="M 353.0 105 L 346.0 110.18 L 346.0 99.82 Z" fill="#6b6b6b"/>
<rect class="s-mid" x="42" y="106" width="182" height="78" rx="3" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" x="133.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">verifier infrastructure</text>
<text class="f-ink" x="133.0" y="139" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">health</text>
<text class="f-mid" x="133.0" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">did the check run at all:</text>
<text class="f-mid" x="133.0" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">timeout, flake, wrong revision</text>
<rect class="s-mid" x="262" y="106" width="182" height="78" rx="3" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
<text class="f-ink" x="353.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">oracle adequacy</text>
<text class="f-mid" x="353.0" y="143" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">can this check detect</text>
<text class="f-mid" x="353.0" y="156.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">the defect at all: coverage,</text>
<text class="f-mid" x="353.0" y="170" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">assertions, environment</text>
<text class="f-ink" x="72" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">verifier failed to run:</text>
<text class="f-mid" x="72" y="220" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">no evidence either way;</text>
<text class="f-mid" x="72" y="233.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">rerun, not a defect (I8)</text>
<text class="f-ink" x="262" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">verifier ran but cannot detect:</text>
<text class="f-mid" x="262" y="220" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">a pass establishes only what</text>
<text class="f-mid" x="262" y="233.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">this verifier can detect</text>
<line class="s-faint" x1="56" y1="184" x2="56" y2="246" stroke="#b8b8b8" stroke-width="1.4" stroke-dasharray="3 3"/>
<path class="f-faint" d="M 56 253 L 50.82 246.0 L 61.18 246.0 Z" fill="#b8b8b8"/>
<line class="s-faint" x1="430" y1="184" x2="430" y2="246" stroke="#b8b8b8" stroke-width="1.4" stroke-dasharray="3 3"/>
<path class="f-faint" d="M 430 253 L 424.82 246.0 L 435.18 246.0 Z" fill="#b8b8b8"/>
<rect class="s-accent" x="67" y="254" width="352" height="40" rx="3" fill="none" stroke="#b34300" stroke-width="1.4"/>
<text class="f-accent" x="243" y="271" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b34300" text-anchor="middle">verdict bound to</text>
<text class="f-accent" x="243" y="285" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b34300" text-anchor="middle">(artifact_version, verifier_version, environment)</text>
<text class="f-ink" x="20.8" y="326" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start">A red check is not a semantic defect, and a green check is only</text>
<text class="f-ink" x="20.8" y="342" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start">as strong as the oracle behind it</text>
</svg>
