<text class="f-ink" x="243" y="266.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="middle">blast radius: every resource and effect reachable</text>
<text class="f-ink" x="243" y="281.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="middle">before a new authorization decision is required</text>
