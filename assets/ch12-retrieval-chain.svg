.bookfig .f-mid{fill:#6b6b6b}:where([data-theme="light"]) .bookfig .s-mid{stroke:#6b6b6b}:where([data-theme="light"]) .bookfig .f-faint{fill:#b8b8b8}:where([data-theme="light"]) .bookfig .s-faint{stroke:#b8b8b8}:where([data-theme="light"]) .bookfig .f-wash{fill:#e2e2e2}:where([data-theme="light"]) .bookfig .s-wash{stroke:#e2e2e2}:where([data-theme="light"]) .bookfig .f-accent{fill:#b34300}:where([data-theme="light"]) .bookfig .s-accent{stroke:#b34300}:where([data-theme="light"]) .bookfig .f-onacc{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-onacc{stroke:#ffffff}</style>
<rect class="f-bg" width="486" height="486" fill="#ffffff"/>
<circle class="f-accent" cx="104.1" cy="41.6" r="5.0" fill="#b34300"/>
<text class="f-ink" x="116.6" y="45.1" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">task</text>
<line class="s-mid" x1="104.1" y1="52.7" x2="104.1" y2="75.7" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 104.1 84.7 L 98.9 75.7 L 109.3 75.7 Z" fill="#6b6b6b"/>
<text class="f-accent" x="116.6" y="69.4" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b34300" text-anchor="start">availability failure</text>
<text class="f-mid" x="116.6" y="84.7" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">corpus coverage or freshness</text>
<circle class="f-mid" cx="104.1" cy="102.7" r="5.0" fill="#6b6b6b"/>
<text class="f-ink" x="116.6" y="106.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">one or more queries, then the index</text>
<line class="s-mid" x1="104.1" y1="113.8" x2="104.1" y2="136.7" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 104.1 145.7 L 98.9 136.7 L 109.3 136.7 Z" fill="#6b6b6b"/>
<text class="f-accent" x="116.6" y="130.5" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b34300" text-anchor="start">retrieval failure</text>
<text class="f-mid" x="116.6" y="145.7" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">query tuning</text>
<circle class="f-mid" cx="104.1" cy="163.8" r="5.0" fill="#6b6b6b"/>
<text class="f-ink" x="116.6" y="167.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ranked results</text>
<line class="s-mid" x1="104.1" y1="174.9" x2="104.1" y2="197.8" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 104.1 206.8 L 98.9 197.8 L 109.3 197.8 Z" fill="#6b6b6b"/>
<text class="f-accent" x="116.6" y="191.5" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b34300" text-anchor="start">placement failure</text>
<text class="f-mid" x="116.6" y="206.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">depth or token budget</text>
<circle class="f-mid" cx="104.1" cy="224.9" r="5.0" fill="#6b6b6b"/>
<text class="f-ink" x="116.6" y="228.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">context budget</text>
<line class="s-mid" x1="104.1" y1="236.0" x2="104.1" y2="258.9" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 104.1 267.9 L 98.9 258.9 L 109.3 258.9 Z" fill="#6b6b6b"/>
<text class="f-accent" x="116.6" y="252.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b34300" text-anchor="start">contextual sufficiency failure</text>
<text class="f-mid" x="116.6" y="267.9" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">implementation, callers, type definition</text>
<circle class="f-mid" cx="104.1" cy="285.9" r="5.0" fill="#6b6b6b"/>
<text class="f-ink" x="116.6" y="289.4" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">model interprets context</text>
<line class="s-mid" x1="104.1" y1="297.0" x2="104.1" y2="320.0" stroke="#6b6b6b" stroke-width="1.6"/>
<path class="f-mid" d="M 104.1 329.0 L 98.9 320.0 L 109.3 320.0 Z" fill="#6b6b6b"/>
<text class="f-accent" x="116.6" y="313.7" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b34300" text-anchor="start">use failure</text>
<circle class="f-mid" cx="104.1" cy="347.0" r="5.0" fill="#6b6b6b"/>
<text class="f-ink" x="116.6" y="350.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">execution and verification, then a scored result</text>
<text class="f-ink" x="20.8" y="410.8" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start">A pass rate records the state at the end</text>
<text class="f-mid" x="20.8" y="428.9" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="start">It cannot identify which transition produced that state</text>
</svg>
