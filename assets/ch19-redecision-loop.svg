<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 458" width="486" height="458" role="img" aria-labelledby="figtitle-ch18-redecision-loop" class="bookfig">
<title id="figtitle-ch18-redecision-loop">The re-decision loop recomputes from observed events under fixed work and churn costs, then executes a deadline capped incumbent while retaining its optimality gap.</title>
