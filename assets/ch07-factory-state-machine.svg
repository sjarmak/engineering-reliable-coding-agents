<text class="f-mid" x="218" y="154" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">unknown_external_state</text>
<circle class="f-faint" cx="380" cy="136" r="4.6" fill="#b8b8b8"/>
<text class="f-mid" x="380" y="154" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">reconcile_required</text>
<line class="s-mid" x1="388" y1="136" x2="452" y2="136" stroke="#6b6b6b" stroke-width="1.4"/>
<line class="s-mid" x1="452" y1="136" x2="452" y2="72" stroke="#6b6b6b" stroke-width="1.4"/>
<line class="s-mid" x1="452" y1="72" x2="437" y2="72" stroke="#6b6b6b" stroke-width="1.4"/>
<path class="f-mid" d="M 430 72 L 437.0 77.18 L 437.0 66.82 Z" fill="#6b6b6b"/>
<text class="f-mid" x="448" y="108" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="end">resolved</text>
<text class="f-mid" x="230" y="108" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle">a retryable attempt failure does not move logical work;</text>
<text class="f-mid" x="230" y="120" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b6b6b" text-anchor="middle">reassignment opens a new epoch, a retry does not</text>
<text class="f-mid" x="20" y="210" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">ATTEMPT UNDER CURRENT EPOCH</text>
<rect class="s-faint" x="16" y="218" width="454" height="150" rx="3" fill="none" stroke="#b8b8b8" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle class="f-mid" cx="58" cy="252" r="5" fill="#6b6b6b"/>
<text class="f-ink" x="58" y="238" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">created</text>
<circle class="f-mid" cx="158" cy="252" r="5" fill="#6b6b6b"/>
<text class="f-ink" x="158" y="238" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">executing</text>
<circle class="f-mid" cx="272" cy="252" r="5" fill="#6b6b6b"/>
<text class="f-ink" x="272" y="238" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">outcome_ready</text>
<circle class="f-mid" cx="400" cy="252" r="5" fill="#6b6b6b"/>
<text class="f-ink" x="400" y="238" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">verification</text>
<line class="s-mid" x1="66" y1="252" x2="143" y2="252" stroke="#6b6b6b" stroke-width="1.4"/>
<path class="f-mid" d="M 150 252 L 143.0 257.18 L 143.0 246.82 Z" fill="#6b6b6b"/>
<line class="s-mid" x1="166" y1="252" x2="257" y2="252" stroke="#6b6b6b" stroke-width="1.4"/>
<path class="f-mid" d="M 264 252 L 257.0 257.18 L 257.0 246.82 Z" fill="#6b6b6b"/>
<line class="s-mid" x1="280" y1="252" x2="385" y2="252" stroke="#6b6b6b" stroke-width="1.4"/>
<path class="f-mid" d="M 392 252 L 385.0 257.18 L 385.0 246.82 Z" fill="#6b6b6b"/>
<line class="s-mid" x1="158" y1="260" x2="158" y2="340" stroke="#6b6b6b" stroke-width="1.4"/>
<line class="s-mid" x1="158" y1="310" x2="293" y2="310" stroke="#6b6b6b" stroke-width="1.4"/>
<path class="f-mid" d="M 300 310 L 293.0 315.18 L 293.0 304.82 Z" fill="#6b6b6b"/>
<text class="f-mid" x="308" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start">terminal failure: work policy decides</text>
<line class="s-mid" x1="58" y1="340" x2="158" y2="340" stroke="#6b6b6b" stroke-width="1.4"/>
<line class="s-mid" x1="58" y1="340" x2="58" y2="269" stroke="#6b6b6b" stroke-width="1.4"/>
<path class="f-mid" d="M 58 262 L 52.82 269.0 L 63.18 269.0 Z" fill="#6b6b6b"/>
<text class="f-mid" x="66" y="356" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start">retryable failure: new attempt, same work and epoch</text>
<text class="f-accent" font-weight="bold" x="300" y="278" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">self-report reaches here, a scheduling signal</text>
<text class="f-ink" x="20" y="394" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Only independently observed evidence completes logical work. Publication is a conditional</text>
<text class="f-ink" x="20" y="409" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">transition for work whose accepted outcome requires an external effect.</text>
</svg>
