<text class="f-ink" x="158" y="92" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">eligible</text>
<circle class="f-mid" cx="268" cy="72" r="5" fill="#6b6b6b"/>
<text class="f-ink" x="268" y="92" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle">owned(epoch)</text>
