<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 365" width="486" height="365" role="img" aria-labelledby="figtitle-ch09-kill-points" class="bookfig">
<title id="figtitle-ch09-kill-points">Five lifecycle kill points test recovery from unstarted work through ambiguous commitment gaps to durable completion, including recognition and suppression of repeated external effects.</title>
