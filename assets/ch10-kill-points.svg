.bookfig .f-mid{fill:#6b6b6b}:where([data-theme="light"]) .bookfig .s-mid{stroke:#6b6b6b}:where([data-theme="light"]) .bookfig .f-faint{fill:#b8b8b8}:where([data-theme="light"]) .bookfig .s-faint{stroke:#b8b8b8}:where([data-theme="light"]) .bookfig .f-wash{fill:#e2e2e2}:where([data-theme="light"]) .bookfig .s-wash{stroke:#e2e2e2}:where([data-theme="light"]) .bookfig .f-accent{fill:#000000}:where([data-theme="light"]) .bookfig .s-accent{stroke:#000000}:where([data-theme="light"]) .bookfig .f-onacc{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-onacc{stroke:#ffffff}</style>
<rect class="f-bg" width="486" height="365" fill="#ffffff"/>
<line class="s-faint" x1="122.1" y1="51.4" x2="122.1" y2="259.6" stroke="#b8b8b8" stroke-width="1.4"/>
<line class="s-mid" x1="106.9" y1="98.5" x2="106.9" y2="226.2" stroke="#6b6b6b" stroke-width="1.4"/>
<line class="s-mid" x1="106.9" y1="98.5" x2="113.8" y2="98.5" stroke="#6b6b6b" stroke-width="1.4"/>
<line class="s-mid" x1="106.9" y1="226.2" x2="113.8" y2="226.2" stroke="#6b6b6b" stroke-width="1.4"/>
<circle class="f-mid" cx="122.1" cy="51.4" r="5.0" fill="#6b6b6b"/>
<text class="f-ink" x="136.0" y="54.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">before dispatch</text>
<text class="f-mid" x="136.0" y="69.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">tests whether unstarted work can be rescheduled</text>
<circle class="f-mid" cx="122.1" cy="106.9" r="5.0" fill="#6b6b6b"/>
<text class="f-ink" x="136.0" y="110.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">after dispatch but before external commitment</text>
<circle class="f-accent" cx="122.1" cy="148.5" r="6.0" fill="#000000"/>
<text class="f-accent" font-weight="bold" x="136.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="start">after commitment but before local acknowledgment</text>
<text class="f-mid" x="136.0" y="166.6" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">the gap a recovery design must survive</text>
<text class="f-mid" x="136.0" y="180.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">place a kill there deliberately</text>
<circle class="f-mid" cx="122.1" cy="217.9" r="5.0" fill="#6b6b6b"/>
<text class="f-ink" x="136.0" y="221.4" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">after acknowledgment but before the durable state transition</text>
<circle class="f-mid" cx="122.1" cy="259.6" r="5.0" fill="#6b6b6b"/>
<text class="f-ink" x="136.0" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">after that transition</text>
<text class="f-mid" x="136.0" y="277.6" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">tests recognition of completed work</text>
<text class="f-mid" x="136.0" y="291.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start">tests suppression of repetition</text>
<text class="f-ink" x="95.8" y="162.4" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 95.8 162.4)">ambiguity and deduplication</text>
<text class="f-ink" x="20.8" y="334.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start">Several external effects call for one sweep per effect</text>
</svg>
